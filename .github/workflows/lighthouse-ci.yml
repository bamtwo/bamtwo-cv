name: Lighthouse CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@03ab67b4509141ee98a9e0b0571826a7f3015e39 # v12.1.4
        with:
          urls: |
            https://bamtwo.github.io/bamtwo-cv/
          budgetPath: .github/lighthouse/budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
